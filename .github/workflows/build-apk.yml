name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK Output
        run: |
          mkdir -p build_output
          cp android/app/build/outputs/apk/debug/app-debug.apk build_output/GridSplitter-debug.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GridSplitter-debug-apk
          path: build_output/GridSplitter-debug.apk
          retention-days: 30

      - name: Create GitHub Release (on Tag or Workflow Dispatch)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: GridSplitter Android APK (${{ github.ref_name || 'v1.0.0' }})
          body: |
            ### GridSplitter Android Release
            
            Install this APK directly on any Android device:
            - **Download:** `GridSplitter-debug.apk`
            - Extract individual headshots from grids with touch boundaries & auto-detection.
            - Direct saving to Downloads and Photo Gallery.
          files: build_output/GridSplitter-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
